name: OwnPath accounts acceptance

on:
  push:
    branches: [feat/ownpath-accounts-billing]
  pull_request:
    paths:
      - src/lib/accounts-billing/**
      - src/app/api/**
      - scripts/accounts-*.mjs
      - scripts/check-ownpath-retired-apis*.mjs
      - scripts/ci-ownpath-browser.mjs
      - e2e/translator*
      - firebase.json
      - firestore.*
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/ownpath-accounts.yml

permissions:
  contents: read

jobs:
  firebase:
    name: Actual demo Auth and Firestore acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:accounts:emulators
  translator:
    name: Compiled guest Translator and retired APIs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/ci-ownpath-browser.mjs
